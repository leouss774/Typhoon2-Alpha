# Regles du peril P04-TAS — Mouvements de terrain - tassement differentiel
# Constantes metier : ce fichier fait foi, jamais le code Python.
peril_id: P04-TAS
name: Mouvements de terrain - tassement differentiel
hazard_available: false
hazard_absence_reason: 'aucune donnee d''alea tassement a la parcelle. Le code communal 127 est contextuel.
  Le tassement lie au retrait-gonflement est traite par P02 : ne pas double-compter.'
commune_context_codes:
- '12'
- '127'
parent_peril: P04
vulnerability:
  variables:
  - key: questionnaire.site.soil_nature
    raw_paths:
    - questionnaire.site.soil_nature
    role: V
    weight: 0.5
    transform:
      type: categorical
      mapping:
        roche: 0.05
        sable: 0.3
        limon: 0.5
        argile: 0.8
        remblai: 1.0
        heterogene: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: Nature du sol d'assise declaree par une etude geotechnique ou les plans. Remblai
      et sol heterogene sont les configurations les plus tassantes.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel SFL-A04 : nature du sol du versant ; BRGM R40355'
    calibration_status: provisional_modeling_weight
    dominant: true
  - key: questionnaire.building.crack_evolution
    raw_paths:
    - questionnaire.building.crack_evolution
    role: V
    weight: 0.5
    transform:
      type: categorical
      mapping:
        aucune: 0.0
        stable: 0.4
        evolutive: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Cinetique des fissures : une fissuration evolutive signale un mouvement en cours.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: high
    references:
    - 'Referentiel M89 (Mzungu et al. 2025) : la cinetique est l''un des quatre criteres du grade'
    calibration_status: provisional_modeling_weight
