services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DVF_ENABLED: ${DVF_ENABLED:-false}
      COPERNICUS_ENABLED: ${COPERNICUS_ENABLED:-false}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      HTTP_TIMEOUT_SECONDS: ${HTTP_TIMEOUT_SECONDS:-15}
    volumes:
      - property_ids:/app/data/property_ids
    ports:
      - "8765:8765"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8765/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  property_ids:
