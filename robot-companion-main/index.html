<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/main.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Robot Companion with window.ai</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-KK94CHFLLe+nY2dmCWGMq91rCGa5gtU4mk92HdvYe+M/SXH301p5ILy+dN9+nJOZ" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ENjdO4Dr2bkBIFxQpeoTz1HIcje39Wm4jDKdf19U8gI4ddQ3GYNS7NTKfAdVQSZe"
    crossorigin="anonymous"></script>
</head>

<body>
  <!-- Import maps polyfill -->
  <!-- Remove this when import maps will be widely supported -->
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>

  <script type="importmap">
    {
      "imports": {
        "three": "../build/three.module.js",
        "three/addons/": "./jsm/"
      }
    }
  </script>

  <script type="module">

    console.log(window);

    import * as THREE from 'three';

    import TWEEN from '@tweenjs/tween.js';

    import Stats from 'three/addons/libs/stats.module.js';
    import {GUI} from 'three/addons/libs/lil-gui.module.min.js';

    import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';

    let container, stats, clock, gui, mixer, actions, activeAction, previousAction;
    let camera, scene, renderer, model, face;

    // État de « parole » : pendant que le chat affiche la réponse mot par mot,
    // le robot ouvre la bouche (morph target) et bouge les bras.
    const talk = {
      active: false,
      time: 0,
      pulse: 0,      // sursaut de bouche décroissant, à chaque mot tapé
      jawIndex: undefined,
      armBones: []
    };

    const api = {state: 'Idle'};

    const actionFunctions = {
      state: {},
      emote: {},
      expression: null
    };

    // No-op par défaut : les vraies implémentations sont branchées dans
    // createGUI() une fois le modèle 3D chargé (App.vue les appelle à tout
    // moment, même si l'utilisateur envoie un message très tôt).
    window.robotTalkStart = function () {};
    window.robotTalkStop = function () {};
    window.robotTalkPulse = function () {};

    init();
    animate();

    function init() {

      container = document.createElement('div');
      document.body.appendChild(container);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.25, 100);
      camera.position.set(0, 3, 10);
      camera.lookAt(0, 2, 0);

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0xe0e0e0);
      scene.fog = new THREE.Fog(0xe0e0e0, 20, 100);

      clock = new THREE.Clock();

      // lights

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444);
      hemiLight.position.set(0, 20, 0);
      scene.add(hemiLight);

      const dirLight = new THREE.DirectionalLight(0xffffff);
      dirLight.position.set(0, 20, 10);
      scene.add(dirLight);

      // ground

      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshPhongMaterial({color: 0x999999, depthWrite: false}));
      mesh.rotation.x = - Math.PI / 2;
      scene.add(mesh);

      const grid = new THREE.GridHelper(200, 40, 0x000000, 0x000000);
      grid.material.opacity = 0.2;
      grid.material.transparent = true;
      scene.add(grid);

      // model

      const loader = new GLTFLoader();
      loader.load('models/gltf/RobotExpressive/RobotExpressive.glb', function (gltf) {

        model = gltf.scene;
        scene.add(model);

        createGUI(model, gltf.animations);

        gui.hide();

      }, undefined, function (e) {

        console.error(e);

      });

      renderer = new THREE.WebGLRenderer({antialias: true});
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      container.appendChild(renderer.domElement);

      window.addEventListener('resize', onWindowResize);

      // stats
      stats = new Stats();
      // container.appendChild(stats.dom);
    }

    function createGUI(model, animations) {

      const states = ['Idle', 'Walking', 'Running', 'Dance', 'Death', 'Sitting', 'Standing'];
      const emotes = ['Jump', 'Yes', 'No', 'Wave', 'Punch', 'ThumbsUp'];

      gui = new GUI();

      window.gui = gui;
      window.api = api;
      window.actionFunctions = actionFunctions;

      mixer = new THREE.AnimationMixer(model);

      actions = {};

      for (let i = 0; i < animations.length; i++) {

        const clip = animations[i];
        const action = mixer.clipAction(clip);
        actions[clip.name] = action;

        if (emotes.indexOf(clip.name) >= 0 || states.indexOf(clip.name) >= 4) {

          action.clampWhenFinished = true;
          action.loop = THREE.LoopOnce;

        }

      }

      // states

      const statesFolder = gui.addFolder('States');

      const clipCtrl = statesFolder.add(api, 'state').options(states);

      clipCtrl.onChange(function () {

        fadeToAction(api.state, 0.5);

      });

      for (var i = 0; i < states.length; i++) {
        const state = states[i];
        actionFunctions.state[state] = function () {
          fadeToAction(state, 0.5);
        };
      };

      statesFolder.open();

      // emotes

      const emoteFolder = gui.addFolder('Emotes');

      function createEmoteCallback(name) {

        api[name] = function () {

          fadeToAction(name, 0.2);

          mixer.addEventListener('finished', restoreState);

        };

        emoteFolder.add(api, name);

      }

      for (var i = 0; i < emotes.length; i++) {
        const emote = emotes[i];
        actionFunctions.emote[emote] = function () {
          fadeToAction(emote, 0.2);

          mixer.addEventListener('finished', restoreState);
        };
      };

      function restoreState() {

        mixer.removeEventListener('finished', restoreState);

        fadeToAction(api.state, 0.2);

      }

      for (let i = 0; i < emotes.length; i++) {

        createEmoteCallback(emotes[i]);

      }

      emoteFolder.open();

      // expressions

      face = model.getObjectByName('Head_4');

      // Morph target de la bouche (jawOpen, sinon mouthOpen/mouthSmileLeft) :
      // il est piloté manuellement ici, hors mixer.
      const morphDict = face.morphTargetDictionary || {};
      talk.jawIndex = (morphDict['jawOpen'] !== undefined) ? morphDict['jawOpen']
        : (morphDict['mouthOpen'] !== undefined) ? morphDict['mouthOpen']
        : morphDict['mouthSmileLeft'];

      // Bras du robot : on les fait balancer pendant la parole. Les os sont
      // réécrits par le mixer à chaque frame, on applique donc la rotation
      // APRÈS mixer.update() (dans animate) pour qu'elle soit visible.
      talk.armBones = [];
      model.traverse(function (o) {
        if (o.isBone && /(Arm|arm)$/.test(o.name)) {
          talk.armBones.push(o);
        }
      });

      // API exposée au chat (App.vue) : start/stop/pulse de la parole.
      window.robotTalkStart = function () {
        talk.active = true;
        talk.time = 0;
      };
      window.robotTalkStop = function () {
        talk.active = false;
        if (talk.jawIndex !== undefined) {
          face.morphTargetInfluences[talk.jawIndex] = 0;
        }
        talk.armBones.forEach(function (b) { b.rotation.z = 0; });
      };
      window.robotTalkPulse = function () {
        if (!talk.active) return;
        // Mini sursaut de bouche à chaque mot tapé : il décroît dans animate()
        talk.pulse = 1;
      };

      const expressions = Object.keys(face.morphTargetDictionary);
      const expressionFolder = gui.addFolder('Expressions');

      for (let i = 0; i < expressions.length; i++) {

        expressionFolder.add(face.morphTargetInfluences, i, 0, 1, 0.01).name(expressions[i]);

      }

      function tweenExpressions(sourceVector, targetVector) {
        const coords = {
          x: sourceVector[0],
          y: sourceVector[1],
          z: sourceVector[2]
        };
        new TWEEN.Tween(coords)
          .to({
            x: targetVector[0],
            y: targetVector[1],
            z: targetVector[2]
          }, 300)
          .easing(TWEEN.Easing.Quadratic.Out)
          .onUpdate(function () {
            face.morphTargetInfluences[0] = coords.x;
            face.morphTargetInfluences[1] = coords.y;
            face.morphTargetInfluences[2] = coords.z;
          })
          .start();
      }

      actionFunctions.expression = function (vector) {
        tweenExpressions(face.morphTargetInfluences, vector);
      }

      activeAction = actions['Idle'];
      activeAction.play();

      expressionFolder.open();

    }

    function fadeToAction(name, duration) {

      previousAction = activeAction;
      activeAction = actions[name];

      if (previousAction !== activeAction) {

        previousAction.fadeOut(duration);

      }

      activeAction
        .reset()
        .setEffectiveTimeScale(1)
        .setEffectiveWeight(1)
        .fadeIn(duration)
        .play();

    }

    function onWindowResize() {

      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();

      renderer.setSize(window.innerWidth, window.innerHeight);

    }

    //

    function animate() {

      const dt = clock.getDelta();

      if (mixer) mixer.update(dt);

      // Parole : bouche qui s'ouvre/ferme et bras qui balancent tant que le
      // robot « parle » (pendant la saisie mot par mot du chat).
      if (talk.active) {
        talk.time += dt;
        const t = talk.time;
        // La bouche suit l'oscillation de parole + le sursaut de chaque mot
        const open = Math.max(0, Math.sin(t * 20));
        if (talk.jawIndex !== undefined) {
          face.morphTargetInfluences[talk.jawIndex] = Math.max(open * 0.85, talk.pulse);
        }
        if (talk.pulse > 0) talk.pulse = Math.max(0, talk.pulse - dt * 4);
        talk.armBones.forEach(function (b, i) {
          b.rotation.z = (i % 2 === 0 ? 1 : -1) * Math.sin(t * 12) * 0.14;
        });
      }

      requestAnimationFrame(animate);

      TWEEN.update();

      renderer.render(scene, camera);

      stats.update();

    }

  </script>

  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
