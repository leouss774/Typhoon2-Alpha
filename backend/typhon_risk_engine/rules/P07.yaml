# Regles du peril P07 — Poids de la neige
# Constantes metier : ce fichier fait foi, jamais le code Python.
peril_id: P07
name: Poids de la neige
hazard_available: false
hazard_absence_reason: 'zonage neige NF EN 1991-1-3/NA non installe. La variable `snowZone` du pipeline
  vaut ''A1'' par DEFAUT, exclue par D04. L''altitude seule est insuffisante : 300 m en Bretagne (zone
  A1, sk=0,45 kN/m2) et 300 m dans le Jura (zone E, sk=1,40) ne portent pas la meme charge (decision 7).'
commune_context_codes: []
hazard_activation_interface:
  lookup_key: lookup.eurocode_snow_zone
  description: Des qu'un lookup officiel versionne commune -> zone neige est installe, basculer hazard_available
    a true et activer le bloc frequence ci-dessous, deja specifie.
  planned_frequency_variables:
  - key: hazard.snow.sk_site
    weight: 1.0
    transform:
      type: linear_ramp
      points:
      - - 0.45
        - 0.0
      - - 0.9
        - 0.5
      - - 1.4
        - 0.85
      - - 4.5
        - 1.0
    formula: sk_site = sk_zone * (1 + A/917)^2 si altitude A > 200 m
    references:
    - 'NF EN 1991-1-3/NA : sk de 0,45 (A1/A2) a 1,40 kN/m2 (E) sous 200 m'
vulnerability:
  variables:
  - key: questionnaire.building.roof.slope_class
    raw_paths:
    - questionnaire.building.roof.slope_class
    role: V
    weight: 0.35
    transform:
      type: categorical
      mapping:
        forte_gt_40: 0.15
        moyenne: 0.45
        faible_lt_15: 0.9
        terrasse: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: Une faible pente et les toitures-terrasses retiennent le manteau neigeux.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P07 : faible pente, toitures-terrasses'
    calibration_status: provisional_modeling_weight
    dominant: true
  - key: questionnaire.building.roof.frame
    raw_paths:
    - questionnaire.building.roof.frame
    role: V
    weight: 0.3
    transform:
      type: categorical
      mapping:
        traditionnelle: 0.4
        fermettes: 0.7
        inconnue: 0.6
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: Les fermettes industrielles sont dimensionnees au plus juste pour la charge reglementaire
      de leur zone.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P07 : charpente sous-dimensionnee'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.roof.accumulation
    raw_paths:
    - questionnaire.building.roof.accumulation
    role: V
    weight: 0.2
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: Noues, redans ou decrochements favorisant l'accumulation locale.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - Referentiel, grille Declencheurs & aggravants P07 ; NF EN 1991-1-3 annexes B et C
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.veranda
    raw_paths:
    - questionnaire.building.veranda
    role: V
    weight: 0.15
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Veranda ou serre accolee : structure legere peu resistante a la charge.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - Referentiel, grille Declencheurs & aggravants P07
    calibration_status: provisional_modeling_weight
