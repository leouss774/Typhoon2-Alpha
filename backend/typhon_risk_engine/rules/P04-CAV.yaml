# Regles du peril P04-CAV — Mouvements de terrain - cavites et affaissements
# Constantes metier : ce fichier fait foi, jamais le code Python.
peril_id: P04-CAV
name: Mouvements de terrain - cavites et affaissements
hazard_available: true
commune_context_codes:
- '12'
- '121'
parent_peril: P04
decomposition_note: 'P04 est decompose en quatre sous-perils independants (cavites, glissement, chute
  de blocs, tassement). Aucun score unique n''est produit : les mecanismes physiques et les donnees different.'
frequency:
  variables:
  - key: hazard.landslide.cavities_count
    raw_paths:
    - georisques.cavites.results
    role: F
    weight: 1.0
    transform:
      type: linear_ramp
      points:
      - - 0
        - 0.0
      - - 1
        - 0.5
      - - 5
        - 1.0
    direction: increasing
    unit: count
    physical_mechanism: Nombre de cavites souterraines recensees dans le rayon de requete. Mecanisme d'effondrement
      distinct du glissement.
    min_source_rank: 2
    allowed_scopes:
    - neighbourhood
    - parcel
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - Georisques base cavites ; PHASE1_AUDIT section 1 (P04)
    calibration_status: provisional_modeling_weight
    dominant: true
    notes: 'accept_no_feature volontairement ABSENT : un results=0 signifie ''aucun objet retourne dans
      ce rayon et selon la couverture de cette base'', PAS ''risque nul''. Le bloc reste donc INDETERMINE.
      Rayon et filtres non documentes par le collector : a enregistrer.'
vulnerability:
  variables:
  - key: questionnaire.site.known_cavity
    raw_paths:
    - questionnaire.site.known_cavity
    role: V
    weight: 0.5
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: Puits, cave, galerie ou cavite connue sous ou pres du bati.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P04 : presence de cavites'
    calibration_status: provisional_modeling_weight
    dominant: true
  - key: questionnaire.site.subsidence_signs
    raw_paths:
    - questionnaire.site.subsidence_signs
    role: V
    weight: 0.5
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Signes d''affaissement observes : sol, dallage, seuils.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - Referentiel, grille Declencheurs & aggravants P04
    calibration_status: provisional_modeling_weight
