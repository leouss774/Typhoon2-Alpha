# Regles du peril P10 — Foudre
# Constantes metier : ce fichier fait foi, jamais le code Python.
peril_id: P10
name: Foudre
hazard_available: false
hazard_absence_reason: aucune donnee de foudroiement. Ni densite Ng, ni densite de points de contact Nsg,
  ni niveau kerauniqe Nk dans le pipeline. La donnee est detenue par Meteorage (filiale Meteo-France)
  et commercialisee. Aucun proxy arbitraire n'est cree (decision 8).
commune_context_codes: []
hazard_activation_interface:
  lookup_key: lookup.lightning_density
  regulatory_threshold: 'NF C 15-100 : AQ1 si Nk < 25 jours/an, AQ2 si Nk >= 25'
  description: Basculer hazard_available a true des qu'une source Ng/Nsg/Nk versionnee est installee.
vulnerability:
  variables:
  - key: questionnaire.building.lightning.surge_protector
    raw_paths:
    - questionnaire.building.lightning.surge_protector
    role: V
    weight: 0.4
    transform:
      type: categorical
      mapping:
        present_conforme: 0.1
        present_non_conforme: 0.5
        absent: 1.0
        inconnu: 0.7
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Parafoudre au tableau conforme NF C 15-100 : protege contre la montee en potentiel
      du reseau, mecanisme dominant des sinistres foudre en habitation.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel XL-V03 : parafoudre conforme NF C 15-100, obligatoire en zone AQ2'
    calibration_status: provisional_modeling_weight
    dominant: true
  - key: questionnaire.building.lightning.earthing_checked
    raw_paths:
    - questionnaire.building.lightning.earthing_checked
    role: V
    weight: 0.25
    transform:
      type: categorical
      mapping:
        controlee: 0.15
        non_controlee: 0.8
        inconnu: 0.7
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Qualite de la prise de terre : conditionne l''ecoulement du courant de defaut.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P10 : qualite de la prise de terre'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.lightning.dominant_position
    raw_paths:
    - questionnaire.building.lightning.dominant_position
    - bdnb.batiment.hauteur_mean
    role: V
    weight: 0.2
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Batiment isole ou nettement plus haut que son environnement : effet d''attraction
      du point d''impact.'
    min_source_rank: 4
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P10 : position dominante du bati'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.lightning.overhead_supply
    raw_paths:
    - questionnaire.building.lightning.overhead_supply
    role: V
    weight: 0.15
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Alimentation aerienne : voie de propagation privilegiee de la surtension.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P10 : ligne aerienne'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.lightning.rod
    raw_paths:
    - questionnaire.building.lightning.rod
    role: protection
    weight: 0.0
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Paratonnerre : capte et ecoule l''impact direct.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: ignore
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P10 : paratonnerre en zone exposee'
    calibration_status: provisional_modeling_weight
    max_reduction: 0.2
