# Regles du peril P04-BLO — Mouvements de terrain - chute de blocs
# Constantes metier : ce fichier fait foi, jamais le code Python.
peril_id: P04-BLO
name: Mouvements de terrain - chute de blocs
hazard_available: false
hazard_absence_reason: aucune donnee d'alea chute de blocs a la parcelle. Le code communal 123 signale
  la presence du phenomene sur la commune, sans localisation ni intensite (poids nul dans F, decision
  D03).
commune_context_codes:
- '12'
- '123'
parent_peril: P04
vulnerability:
  variables:
  - key: questionnaire.site.rockfall_exposure
    raw_paths:
    - questionnaire.site.rockfall_exposure
    role: V
    weight: 1.0
    transform:
      type: categorical
      mapping:
        aucune_paroi: 0.0
        paroi_lointaine: 0.3
        paroi_proche: 0.8
        paroi_surplombante: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: Presence et proximite d'une paroi rocheuse ou d'un talus instable surplombant
      le bati.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel UNISDR 2017 (Landslide) : intensite = volume x vitesse du bloc'
    calibration_status: provisional_modeling_weight
    dominant: true
