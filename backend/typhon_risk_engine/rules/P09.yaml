# Regles du peril P09 — Feu de foret / interface habitat-foret
# Constantes metier : ce fichier fait foi, jamais le code Python.
peril_id: P09
name: Feu de foret / interface habitat-foret
hazard_available: true
commune_context_codes:
- '16'
frequency:
  variables:
  - key: site.distance_to_forest
    raw_paths:
    - derive.distance_to_forest
    role: F
    weight: 0.5
    transform:
      type: linear_ramp
      points:
      - - 0
        - 1.0
      - - 50
        - 0.9
      - - 200
        - 0.5
      - - 1000
        - 0.1
      - - 5000
        - 0.0
    direction: increasing
    unit: m
    physical_mechanism: 'Distance au combustible forestier : variable dominante de l''exposition en interface
      habitat-foret.'
    min_source_rank: 2
    allowed_scopes:
    - parcel
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel IBF-063/064 (IberFire 2025) : proportions CLC foret et landes'
    - PHASE1_AUDIT section 5.3 (P09)
    calibration_status: provisional_modeling_weight
    dominant: true
    notes: Module WFS masque foret non raccorde au collector. Calculable depuis geom_groupe (Lambert-93)
      et une couche forestiere.
  - key: climate.fire_weather_index
    raw_paths:
    - derive.fwi_van_wagner
    role: F
    weight: 0.3
    transform:
      type: linear_ramp
      points:
      - - 5
        - 0.0
      - - 15
        - 0.35
      - - 30
        - 0.8
      - - 50
        - 1.0
    direction: increasing
    unit: index
    physical_mechanism: 'Danger meteorologique de feu (FWI) : chaine physique complete temperature, humidite,
      vent, precipitations.'
    min_source_rank: 4
    allowed_scopes:
    - climate_grid
    - department
    allowed_time_horizons:
    - historical
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: high
    references:
    - Referentiel, onglet Formules FWI P09 (Van Wagner 1987)
    calibration_status: provisional_modeling_weight
    notes: 'NON calculable en l''etat : Van Wagner exige temperature, humidite relative, vent et precipitations
      ; le collector ne demande que temperature_2m_max et precipitation_sum. Le calcul exige en outre
      une convention horaire, l''initialisation de FFMC/DMC/DC et un traitement des jours manquants. Aucun
      `historical_fwi_proxy` n''entre dans F.'
  - key: climate.consecutive_dry_days
    raw_paths:
    - climat_open_meteo.derived.consecutive_dry_days
    role: F
    weight: 0.2
    transform:
      type: linear_ramp
      points:
      - - 5
        - 0.0
      - - 20
        - 0.5
      - - 45
        - 1.0
    direction: increasing
    unit: count
    physical_mechanism: 'Secheresse du combustible : duree de la sequence sans pluie.'
    min_source_rank: 4
    allowed_scopes:
    - climate_grid
    - department
    allowed_time_horizons:
    - historical
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel IberFire 2025 : SWI et indices de secheresse'
    calibration_status: provisional_modeling_weight
vulnerability:
  variables:
  - key: questionnaire.site.vegetation_within_10m
    raw_paths:
    - questionnaire.site.vegetation_within_10m
    role: V
    weight: 0.35
    transform:
      type: categorical
      mapping:
        aucune: 0.05
        herbacee: 0.35
        arbustive: 0.7
        resineux: 1.0
        feuillus: 0.6
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Continuite du combustible au contact du bati : determine la probabilite d''atteinte
      par le front ou les brandons.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P09 : distance vegetation-bati'
    calibration_status: provisional_modeling_weight
    dominant: true
  - key: questionnaire.building.facade_material
    raw_paths:
    - questionnaire.building.facade_material
    role: V
    weight: 0.25
    transform:
      type: categorical
      mapping:
        mineral: 0.15
        bois: 1.0
        bardage_composite: 0.6
        inconnu: 0.6
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: Combustibilite de l'enveloppe.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P09 : toiture/facades combustibles'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.openings_protection
    raw_paths:
    - questionnaire.building.openings_protection
    role: V
    weight: 0.2
    transform:
      type: categorical
      mapping:
        volets_metal_ou_bois_plein: 0.2
        volets_pvc: 0.8
        aucun: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: Les ouvertures sont le point d'entree du rayonnement et des brandons ; le PVC
      flue avant rupture du vitrage.
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P09 : ouvertures'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.site.access_for_firefighters
    raw_paths:
    - questionnaire.site.access_for_firefighters
    role: V
    weight: 0.2
    transform:
      type: categorical
      mapping:
        voie_carrossable_lt_50m: 0.2
        difficile: 0.7
        tres_difficile: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Defendabilite : capacite des secours a atteindre et proteger le bati.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P09 : acces pompiers'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.site.brush_clearing
    raw_paths:
    - questionnaire.site.brush_clearing
    role: protection
    weight: 0.0
    transform:
      type: categorical
      mapping:
        conforme_lt_12m: 1.0
        partiel: 0.5
        non_conforme: 0.0
        non_soumis: 0.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Debroussaillement reglementaire (OLD) : reduit la charge de combustible au contact.
      Agit ici sur V uniquement (decision 15).'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: ignore
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P09 : debroussaillement non conforme'
    calibration_status: provisional_modeling_weight
    max_reduction: 0.3
  - key: questionnaire.site.water_reserve
    raw_paths:
    - questionnaire.site.water_reserve
    role: protection
    weight: 0.0
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: Reserve d'eau accessible aux secours (piscine, citerne, bache).
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: ignore
    on_conflict: keep_highest_rank
    evidence_level: low
    references:
    - Referentiel, grille Declencheurs & aggravants P09
    calibration_status: provisional_modeling_weight
    max_reduction: 0.1
