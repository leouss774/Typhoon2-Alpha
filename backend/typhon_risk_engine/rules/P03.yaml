peril_id: "P03"
name: "Seisme"
hazard_available: true
commune_context_codes: ["13"]

frequency:
  variables:
    - key: "hazard.seismic.zone"
      raw_paths: ["georisques.zonage_sismique.data[0].code_zone"]
      role: "F"
      dominant: true
      weight: 1.00
      transform:
        type: "categorical"
        mapping: {"1": 0.0, "2": 0.25, "3": 0.5, "4": 0.75, "5": 1.0}
        unmapped: null
      direction: "increasing"
      unit: "zone"
      physical_mechanism: >
        Zonage probabiliste reglementaire (10 % de depassement en 50 ans).
        Seuils d'acceleration : z1 < 0,7 m/s2 ; z2 0,7-1,1 ; z3 1,1-1,6 ;
        z4 1,6-3,0 ; z5 >= 3,0.
      min_source_rank: 3
      allowed_scopes: ["commune", "parcel", "building", "building_group"]
      allowed_time_horizons: ["current"]
      on_missing: "block_indeterminate"
      on_conflict: "keep_highest_rank"
      evidence_level: "high"
      references:
        - "Art. D.563-8-1 du code de l'environnement ; decret n. 2010-1255 du 22 octobre 2010"
        - "PHASE1_AUDIT section 5.2"
      calibration_status: "published_threshold"
      notes: >
        Echelle COMMUNALE. Les effets de site (classe de sol EC8) peuvent faire
        varier fortement le mouvement dans une meme commune et ne sont pas
        disponibles. Limite majeure a afficher.

vulnerability:
  variables:
    - key: "building.structure.wall_material"
      raw_paths:
        - "bdnb.batiment.materiaux_structure_mur_exterieur"
        - "bdnb.batiment.mat_mur_txt"
        - "questionnaire.building.structure.wall_material"
      role: "V"
      dominant: true
      weight: 0.40
      transform:
        type: "categorical"
        mapping:
          "moellons": 1.0
          "pierre": 0.9
          "brique": 0.75
          "parpaing": 0.65
          "murs en beton banche": 0.35
          "murs en beton banché": 0.35
          "beton arme": 0.35
          "béton armé": 0.35
          "beton": 0.4
          "ossature bois": 0.5
          "bois": 0.5
          "acier": 0.45
        unmapped: null
      direction: "increasing"
      unit: "class"
      physical_mechanism: >
        Le systeme porteur conditionne la capacite a dissiper l'energie sismique.
        La maconnerie non chainee est la typologie la plus fragile, les voiles en
        beton arme la plus resistante.
      min_source_rank: 4
      allowed_scopes: ["dwelling", "building", "building_group"]
      allowed_time_horizons: ["current"]
      on_missing: "block_indeterminate"
      on_conflict: "keep_highest_rank"
      evidence_level: "medium"
      references:
        - "Referentiel RUE-V01 (Lagomarsino & Giovinazzi 2006, RISK-UE Table 3) : indices V par typologie, utilises ici en CLASSEMENT ORDINAL uniquement"
        - "Decision 11 : l'equation muD n'est PAS implementee, faute de conversion justifiee acceleration -> intensite EMS-98"
      calibration_status: "provisional_modeling_weight"
      notes: >
        Classement ordinal derive de la hierarchie RISK-UE. Les valeurs d'indice
        ne sont PAS les indices V publies : elles en reprennent l'ordre, pas
        l'echelle. La conversion ag -> EMS-98 etant absente du corpus, aucune
        fonction de fragilite n'est appliquee.

    - key: "building.year_built"
      raw_paths: ["bdnb.batiment.annee_construction", "questionnaire.building.year_built"]
      role: "V"
      weight: 0.25
      transform:
        type: "linear_ramp"
        points: [[1900, 1.0], [1969, 1.0], [1992, 0.7], [2011, 0.35], [2012, 0.25]]
      direction: "decreasing"
      unit: "year"
      physical_mechanism: >
        Epoque de construction rapportee aux regles parasismiques successives :
        aucune regle avant 1969, PS69/PS92 ensuite, Eurocode 8 obligatoire depuis
        le 1er mai 2011.
      min_source_rank: 4
      allowed_scopes: ["dwelling", "building", "building_group"]
      allowed_time_horizons: ["current"]
      on_missing: "renormalize_if_dominant_present"
      on_conflict: "keep_highest_rank"
      evidence_level: "medium"
      references:
        - "Decret n. 2010-1254 et arrete du 22 octobre 2010 : EC8 applicable au 1er mai 2011"
        - "Referentiel, grille Declencheurs & aggravants P03"
      calibration_status: "provisional_modeling_weight"
      notes: >
        Les dates de bascule reglementaires sont publiees. Les VALEURS d'indice
        attachees a chaque palier sont provisoires.

    - key: "building.levels"
      raw_paths: ["bdnb.batiment.nb_niveau", "questionnaire.building.levels"]
      role: "V"
      weight: 0.25
      transform:
        type: "linear_ramp"
        points: [[1, 0.2], [4, 0.5], [10, 0.8], [20, 1.0]]
      direction: "increasing"
      unit: "count"
      physical_mechanism: >
        La hauteur augmente la periode propre et les efforts en pied de
        structure ; elle accroit aussi l'exposition aux effets de site.
      min_source_rank: 4
      allowed_scopes: ["building", "building_group", "dwelling"]
      allowed_time_horizons: ["current"]
      on_missing: "renormalize_if_dominant_present"
      on_conflict: "keep_highest_rank"
      evidence_level: "low"
      references:
        - "Referentiel, grille Declencheurs & aggravants P03 : irregularite en elevation"
      calibration_status: "provisional_modeling_weight"

    - key: "building.seismic.soft_storey"
      raw_paths: ["questionnaire.building.seismic.soft_storey"]
      role: "V"
      weight: 0.10
      transform: {type: "boolean", true: 1.0, false: 0.0}
      direction: "increasing"
      unit: "bool"
      physical_mechanism: >
        Rez-de-chaussee largement ouvert : discontinuite de raideur concentrant
        la deformation sur un seul niveau.
      min_source_rank: 3
      allowed_scopes: ["dwelling", "building", "building_group"]
      allowed_time_horizons: ["current"]
      on_missing: "renormalize_if_dominant_present"
      on_conflict: "keep_highest_rank"
      evidence_level: "medium"
      references: ["Referentiel, grille Declencheurs & aggravants P03 : niveau souple en rez-de-chaussee"]
      calibration_status: "provisional_modeling_weight"

    - key: "building.seismic.chaining"
      raw_paths: ["questionnaire.building.seismic.chaining"]
      role: "protection"
      max_reduction: 0.25
      weight: 0.0
      transform: {type: "boolean", true: 1.0, false: 0.0}
      direction: "decreasing"
      unit: "bool"
      physical_mechanism: >
        Le chainage horizontal et vertical solidarise les murs et evite la ruine
        par desolidarisation. Agit sur la resistance du bati, pas sur l'alea.
      min_source_rank: 3
      allowed_scopes: ["dwelling", "building", "building_group"]
      allowed_time_horizons: ["current"]
      on_missing: "ignore"
      on_conflict: "keep_highest_rank"
      evidence_level: "medium"
      references:
        - "Referentiel BRGM/RP-54862-FR : chainage present dans les mesures de renforcement"
        - "Referentiel, grille Declencheurs & aggravants P03"
      calibration_status: "provisional_modeling_weight"
