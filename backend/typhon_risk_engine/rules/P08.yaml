# Regles du peril P08 — Incendie du batiment
# Constantes metier : ce fichier fait foi, jamais le code Python.
peril_id: P08
name: Incendie du batiment
hazard_available: true
commune_context_codes: []
evidence_disclaimer: Modele ORDINAL de niveau de preuve FAIBLE. Aucun taux de base ni coefficient segmente
  n'existe dans le corpus. Les poids sont des ponderations provisoires de modelisation. Les donnees climatiques
  ne doivent pas etre la variable principale (elles sont ici totalement absentes du bloc).
frequency:
  variables:
  - key: questionnaire.building.electrical.diagnosis_age
    raw_paths:
    - questionnaire.building.electrical.diagnosis_age
    role: F
    weight: 0.4
    transform:
      type: categorical
      mapping:
        lt_15: 0.3
        ge_15: 0.9
        jamais: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Vetuste de l''installation electrique : premiere cause identifiee d''incendie
      domestique. Seuil d''opposabilite legal a 15 ans.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: low
    references:
    - 'Referentiel XL-V13 : anciennete du diagnostic electrique, seuil 15 ans'
    calibration_status: provisional_modeling_weight
    dominant: true
  - key: building.heating.generator
    raw_paths:
    - bdnb.batiment.type_generateur_chauffage
    - questionnaire.building.heating.generator
    role: F
    weight: 0.3
    transform:
      type: categorical
      mapping:
        pac air/air: 0.15
        pac air/eau: 0.15
        pac: 0.15
        convecteur electrique: 0.25
        electrique: 0.25
        chaudiere gaz: 0.55
        chaudiere gaz standard: 0.55
        chaudiere fioul: 0.7
        poele a bois: 0.85
        cheminee ouverte: 1.0
        insert bois: 0.8
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Source d''ignition liee au generateur de chauffage : la combustion solide et
      la cheminee ouverte dominent.'
    min_source_rank: 4
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: low
    references:
    - 'Referentiel, grille Declencheurs & aggravants P08 : type de chauffage (bois, gaz)'
    calibration_status: provisional_modeling_weight
  - key: building.dhw.generator
    raw_paths:
    - bdnb.batiment.type_generateur_ecs
    - questionnaire.building.dhw.generator
    role: F
    weight: 0.15
    transform:
      type: categorical
      mapping:
        ballon electrique: 0.15
        electrique: 0.15
        pac: 0.15
        chaudiere gaz standard: 0.6
        chaudiere gaz: 0.6
        chaudiere fioul: 0.7
        solaire: 0.15
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Source d''ignition de l''eau chaude sanitaire, DISTINCTE du chauffage. Une PAC
      electrique en chauffage et une chaudiere gaz en ECS ne sont pas une contradiction : ce sont deux
      sources a evaluer separement.'
    min_source_rank: 4
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: low
    references:
    - 'Referentiel XL-V14 : entretien annuel de la chaudiere ; ADDENDUM section 5'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.chimney.sweep_age
    raw_paths:
    - questionnaire.building.chimney.sweep_age
    role: F
    weight: 0.15
    transform:
      type: categorical
      mapping:
        sans_objet: 0.0
        lt_12m: 0.2
        ge_12m: 0.9
        jamais: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Defaut de ramonage : cause frequente de feu de conduit et motif courant de reduction
      d''indemnite.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: low
    references:
    - 'Referentiel XL-V02 : ramonage annuel certifie'
    calibration_status: provisional_modeling_weight
vulnerability:
  variables:
  - key: questionnaire.building.fire.daaf
    raw_paths:
    - questionnaire.building.fire.daaf
    role: V
    weight: 0.35
    transform:
      type: categorical
      mapping:
        installe_teste: 0.1
        installe_non_teste: 0.5
        absent: 1.0
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Detecteur avertisseur autonome de fumee : reduit la SEVERITE par detection precoce,
      pas la frequence d''ignition.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel XL-V01 : DAAF installe et teste, reduit la severite pas la frequence'
    calibration_status: provisional_modeling_weight
    dominant: true
  - key: questionnaire.building.fire.compartmentation
    raw_paths:
    - questionnaire.building.fire.compartmentation
    role: V
    weight: 0.25
    transform:
      type: categorical
      mapping:
        oui: 0.15
        partielle: 0.5
        non: 1.0
        inconnue: 0.6
      unmapped: null
    direction: increasing
    unit: class
    physical_mechanism: 'Recoupement coupe-feu : limite la propagation entre volumes.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P08 : absence de recoupement coupe-feu'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.fire.converted_attic
    raw_paths:
    - questionnaire.building.fire.converted_attic
    role: V
    weight: 0.2
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Combles amenages : volume habite sous charpente, propagation rapide et evacuation
      difficile.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P08 : combles amenages'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.fire.attached_garage
    raw_paths:
    - questionnaire.building.fire.attached_garage
    role: V
    weight: 0.2
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Garage accole : charge calorifique elevee contigue au logement.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: renormalize_if_dominant_present
    on_conflict: keep_highest_rank
    evidence_level: medium
    references:
    - 'Referentiel, grille Declencheurs & aggravants P08 : stockage de combustibles'
    calibration_status: provisional_modeling_weight
  - key: questionnaire.building.fire.extinguisher
    raw_paths:
    - questionnaire.building.fire.extinguisher
    role: protection
    weight: 0.0
    transform:
      type: boolean
      'true': 1.0
      'false': 0.0
    direction: increasing
    unit: bool
    physical_mechanism: 'Extincteur ou couverture anti-feu accessible : intervention immediate sur depart
      de feu.'
    min_source_rank: 3
    allowed_scopes:
    - dwelling
    - building
    - building_group
    allowed_time_horizons:
    - current
    on_missing: ignore
    on_conflict: keep_highest_rank
    evidence_level: low
    references:
    - 'Referentiel, grille Declencheurs & aggravants P08 : moyens d''extinction'
    calibration_status: provisional_modeling_weight
    max_reduction: 0.1
